name: Fluidly
description: >-
  Fluidly was a London-based intelligent cashflow forecasting fintech founded in
  2016 by Caroline Plumb, providing SME cash-flow prediction, scenario planning,
  and working-capital tools used by roughly 1,300 UK accountancy firms. OakNorth
  Bank acquired Fluidly in December 2021 and folded the product into its Credit
  Intelligence Suite; the independent Fluidly brand has since been retired and
  fluidly.com now redirects to OakNorth's partnerships page. This profile is
  retained in the API Evangelist network as an acquired-company record — no
  independent Fluidly developer portal, OpenAPI, or public API surface remains.
